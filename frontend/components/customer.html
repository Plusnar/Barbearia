<!-- CUSTOMER VIEW - Agendamentos do Cliente -->
<div id="customerView" class="grid hidden">
  <!-- Novo Agendamento -->
  <section class="card span-5">
    <h3>Novo agendamento</h3>
    <form id="bookingForm">
      <div class="field">
        <label for="serviceSelect">Serviço</label>
        <select id="serviceSelect" required></select>
      </div>
      <div class="field">
        <label for="barberSelect">Barbeiro</label>
        <select id="barberSelect" required></select>
      </div>
      <div class="field">
        <label for="dateInput">Data</label>
        <input id="dateInput" type="date" required />
      </div>
      <div class="field">
        <label for="timeSelect">Horário</label>
        <select id="timeSelect" required></select>
      </div>
      <div class="field">
        <label for="notesInput">Observações</label>
        <textarea id="notesInput" placeholder="Ex.: corte com barba"></textarea>
      </div>
      <button class="primary" type="submit">Confirmar agendamento</button>
    </form>
    <div id="bookingStatus" class="status"></div>
  </section>

  <!-- Meus Agendamentos -->
  <section class="card span-7">
    <h3>Meus agendamentos</h3>
    <div id="customerAppointments" class="list"></div>
  </section>
</div>
