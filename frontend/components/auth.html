<!-- AUTH PANEL - Login e Registro -->
<div id="authPanel" class="phone-body">
  <div class="tabs">
    <button id="loginTab" class="tab active" type="button">Entrar</button>
    <button id="registerTab" class="tab" type="button">Criar conta</button>
  </div>

  <!-- Login Form -->
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" autocomplete="email" value="admin@barbearia.com" required />
    </div>
    <div class="field">
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required />
    </div>
    <button class="primary" type="submit">Entrar agora</button>
  </form>

  <!-- Register Form -->
  <form id="registerForm" class="hidden">
    <div class="field">
      <label for="registerName">Nome completo</label>
      <input id="registerName" type="text" autocomplete="name" required />
    </div>
    <div class="field">
      <label for="registerEmail">E-mail</label>
      <input id="registerEmail" type="email" autocomplete="email" required />
    </div>
    <div class="field">
      <label for="registerPhone">Telefone</label>
      <input id="registerPhone" type="tel" placeholder="(11) 99999-9999" required />
    </div>
    <div class="field">
      <label for="registerPassword">Senha</label>
      <input id="registerPassword" type="password" autocomplete="new-password" required />
    </div>
    <div class="field">
      <label for="registerRole">Perfil para a demonstração</label>
      <select id="registerRole">
        <option value="CUSTOMER">Cliente</option>
        <option value="BARBER">Barbeiro</option>
        <option value="ADMIN">Administrador</option>
      </select>
    </div>
    <button class="primary" type="submit">Criar conta</button>
  </form>

  <div id="authStatus" class="status">API local: http://localhost:5000</div>
</div>
