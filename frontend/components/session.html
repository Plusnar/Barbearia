<!-- SESSION PANEL - Dados do usuário autenticado -->
<div id="sessionPanel" class="phone-body hidden">
  <div class="list">
    <div class="item">
      <strong id="sessionName">Usuário</strong>
      <small id="sessionInfo"></small>
    </div>
    <button id="refreshBtn" class="primary" type="button">Atualizar dados</button>
    <button id="logoutBtn" class="secondary danger" type="button">Sair</button>
  </div>
</div>
