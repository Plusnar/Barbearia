<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #1f1f1f; --primary-dark: #000000; --secondary: #FFB81C; --secondary-dark: #FF9800; --error: #B3261E; --white: #FFFFFF; --text-primary: #1f1f1f; --text-secondary: #757575; --background: #F5F5F5; --background-light: #E8E8E8; --success: #4CAF50; --background-dark: #424242; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: linear-gradient(45deg, #1f1f1f, #2d2d2d); background-attachment: fixed; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-container { width: 100%; max-width: 480px; }
        .logo-section { display: flex; justify-content: center; margin-bottom: 32px; }
        .logo-circle { width: 80px; height: 80px; border: 2px solid var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: transparent; }
        .logo-circle span { font-size: 48px; font-weight: bold; color: var(--secondary); margin-bottom: 6px; }
        .login-header { text-align: center; margin-bottom: 48px; color: var(--white); }
        .login-header h1 { font-size: 36px; font-weight: bold; margin-bottom: 8px; color: var(--white); }
        .login-header p { font-size: 14px; color: var(--text-secondary); }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); overflow: hidden; }
        .card-body { padding: 24px; }
        .input-group-custom { display: flex; align-items: center; height: 56px; background-color: var(--background); border-radius: 8px; border: 1px solid var(--secondary); padding: 0 16px; margin-bottom: 16px; transition: all 0.3s ease; }
        .input-group-custom:focus-within { box-shadow: 0 0 0 3px rgba(255, 184, 28, 0.1); border-color: var(--secondary); }
        .input-group-custom .icon { font-size: 20px; margin-right: 12px; flex-shrink: 0; }
        .input-group-custom .icon.secondary { color: var(--secondary); }
        .input-group-custom input { border: none; background: transparent; flex: 1; font-size: 16px; color: var(--text-primary); outline: none; padding: 0; }
        .input-group-custom input::placeholder { color: var(--text-secondary); }
        .input-group-custom input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px var(--background) inset; -webkit-text-fill-color: var(--text-primary); }
        .btn-login { width: 100%; height: 52px; background: linear-gradient(135deg, var(--secondary), var(--secondary-dark)); color: var(--white); border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(255, 184, 28, 0.3); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 184, 28, 0.4); background: linear-gradient(135deg, var(--secondary-dark), var(--secondary)); color: var(--white); }
        .btn-login:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(255, 184, 28, 0.3); }
        .progress-bar-custom { display: none; width: 100%; height: 4px; background-color: var(--background-light); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
        .progress-bar-custom.active { display: block; }
        .progress-bar-custom::after { content: ''; display: block; width: 30%; height: 100%; background: linear-gradient(90deg, var(--secondary), var(--secondary-dark)); animation: progress 1.5s ease-in-out infinite; }
        @keyframes progress { 0% { transform: translateX(-100%); } 50% { transform: translateX(400%); } 100% { transform: translateX(-100%); } }
        .divider { display: flex; align-items: center; margin: 16px 0; color: var(--text-secondary); }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background-color: var(--background); }
        .divider span { padding: 0 12px; font-size: 12px; }
        .register-link { text-align: center; font-size: 14px; }
        .register-link span { color: var(--text-secondary); }
        .register-link a { color: var(--secondary); text-decoration: none; font-weight: bold; cursor: pointer; transition: color 0.3s ease; }
        .register-link a:hover { color: var(--secondary-dark); }
        .footer-text { text-align: center; color: var(--text-secondary); font-size: 12px; margin-top: 32px; }
        @media (max-width: 480px) { body { padding: 16px; } .login-header h1 { font-size: 28px; } .logo-circle { width: 64px; height: 64px; } .logo-circle span { font-size: 36px; } .login-header { margin-bottom: 32px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-circle">
                <span>B</span>
            </div>
        </div>

        <!-- Header -->
        <div class="login-header">
            <h1>Barbearia</h1>
            <p>Bem-vindo de volta</p>
        </div>

        <!-- Card Container -->
        <div class="card">
            <div class="card-body">
                <!-- Form -->
                <form id="loginForm">
                    <!-- Progress Bar -->
                    <div class="progress-bar-custom" id="progressBar"></div>

                    <!-- Email Input -->
                    <div class="input-group-custom">
                        <span class="icon secondary"></span>
                        <input 
                            type="email" 
                            placeholder="Email" 
                            id="emailInput"
                            required
                        >
                    </div>

                    <!-- Password Input -->
                    <div class="input-group-custom">
                        <span class="icon"></span>
                        <input 
                            type="password" 
                            placeholder="Senha" 
                            id="passwordInput"
                            required
                        >
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn-login" id="loginBtn">
                        Entrar
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span></span>
                </div>

                <!-- Register Link -->
                <div class="register-link">
                    <span>Não tem uma conta? </span>
                    <a href="signup_novo.html">Criar conta</a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-text">
            <p>© 2024 Barbearia. Todos os direitos reservados.</p>
        </div>
    </div>

  <script>
    const API_BASE = 'http://localhost:5000';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      const progressBar = document.getElementById('progressBar');
      const loginBtn = document.getElementById('loginBtn');
      
      progressBar.classList.add('active');
      loginBtn.disabled = true;

      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          console.log('Resposta login:', data);

          // guardar token e usuário no navegador
          localStorage.setItem('barbearia_token', data.token);
          localStorage.setItem('barbearia_user', JSON.stringify(data.user));

          // ir para o menu
          window.location.href = 'menu.html';
        } else {
          alert(data.message || 'Falha no login');
          progressBar.classList.remove('active');
          loginBtn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        alert('Erro ao conectar ao servidor.');
        progressBar.classList.remove('active');
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
